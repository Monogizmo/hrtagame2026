<style>

return `<div class="pw"><div class="pt"><span class="pill">${W.cat}</span><b>ข้อ ${W.i+1}/${L.length}</b><div class="dots">${L.map((x,i)=>`<span class="dot ${W.st[x.id]==='done'?'d':W.st[x.id]==='skip'?'k':''} ${i===W.i?'cur':''}"></span>`).join('')}</div></div>

<details class="ctl" ${a} ${ctlOpen?'open':''} ontoggle="ctlOpen=this.open"><summary>แผงควบคุมทีมงาน · แตะเพื่อซ่อนก่อนโชว์ผู้เล่น</summary><div class="row"><button class="btn pri xl" onclick="wstep()">${['เปิดคำใบ้ 1','เปิดคำใบ้ 2','เปิดเฉลย','ข้อต่อไป'][s]}</button>${s>=1?(sr!=null?`<span class="pill">Steal +1 → ${esc(S.teams[sr])}</span><button class="btn" onclick="unsteal()">ย้อน Steal</button>`:'<span>ทีมที่ Steal ถูก:</span>'+S.teams.map((t,i)=>`<button class="btn" style="--ac:var(--c4)" onclick="steal(${i})">${esc(t)}</button>`).join('')):''}</div><div class="row"><button class="btn" onclick="wgo(-1)">ก่อนหน้า</button><button class="btn" onclick="wgo(1)">ข้อต่อไป (ไม่เปิดเฉลย)</button><button class="btn" onclick="wdone()">ทำเครื่องหมายเสร็จ</button><button class="btn" onclick="wskip()">ข้าม</button><button class="btn" onclick="wreset()">รีเซ็ตข้อนี้</button><button class="btn ghost" onclick="fs()">เต็มจอ</button><button class="btn ghost" onclick="S.wd.cat=null;save();render()">ออก</button><span class="pill" id="el"></span>${w.note?`<span class="mu">⚠ ${esc(w.note)}</span>`:''}</div></details></div>`}
function wcat(c){const L=wl(c),i=L.findIndex(w=>!S.wd.st[w.id]);S.wd.cat=c;wset(i<0?0:i)}

<h3>บันทึกคะแนน</h3><div class="card"><div class="mu">1 · เลือกทีม</div><div class="seg">${[0,1,2,3].map(i=>`<button class="btn ${st_===i?'pri':''}" onclick="st_=${i};render()">${esc(S.teams[i])}</button>`).join('')}</div><div class="mu">2 · เลือกเกม</div><div class="seg">${G.map(g=>`<button class="btn ${sg===g?'pri':''}" onclick="sg='${g}';render()">${GN[g]}</button>`).join('')}</div><div class="mu">3 · กดคะแนน · ${esc(S.teams[st_])} / ${GN[sg]} ตอนนี้ ${S.sc[sg][st_]} (บันทึกทันที ย้อนได้)</div><div class="seg q">${[-10,-5,-1,1,5,10].map(v=>`<button class="btn xl ${v>0?'pri':''}" onclick="change(sg,st_,${v},'ทีมงานปรับเอง')">${v>0?'+':'−'}${Math.abs(v)}</button>`).join('')}</div><details><summary>ใส่จำนวนเอง / ตั้งค่าเป็น</summary><div class="row"><input type="number" id="am" value="${amt}" style="width:110px" onchange="amt=+this.value"><button class="btn" onclick="sadd(1)">+ เพิ่ม</button><button class="btn" onclick="sadd(-1)">− ลด</button><button class="btn" onclick="sset()">ตั้งค่าเป็น</button></div></details><div class="row"><button class="btn ghost xl" onclick="undo()">Undo ล่าสุด</button></div></div>
<h3>ประวัติ</h3><div class="list">${S.log.slice(-40).reverse().map(e=>`<div class="row2" style="cursor:default"><b>${e.d>0?'+':''}${e.d}</b><div>${esc(S.teams[e.t])} · ${GN[e.game]} <span class="mu">${esc(e.note||'')} · ${e.time}</span></div></div>`).join('')||'<div class="mu">ยังไม่มีรายการ</div>'}</div></div>`}

const SB_URL='https://ttauknjxdfdvuydvlfwa.supabase.co',SB_KEY='sb_publishable_EyfjkuNQKZfXqGWS5hvUYQ_o9WDjweL',CID=Math.random().toString(36).slice(2);

async function push(){if(!SB)return;if(busy){again=true;return}busy=true;try{
 const up=new Set([S.id,...need]);
 for(const id of up){const s=store.list[id];if(!s)continue;const r=await SB.from('gm_state').upsert({id,data:sdata(s),updated_at:new Date().toISOString()});if(r.error)throw r.error}
 for(const s of Object.values(store.list)){const sy=synced[s.id]||(synced[s.id]=new Set()),ids=new Set(s.log.map(e=>e.id)),ins=s.log.filter(e=>!sy.has(e.id)).map(e=>({id:e.id,sid:s.id,e,ts:e.ts||0})),del=[...sy].filter(i=>!ids.has(i));
